# Save this file in your repo as: .github/workflows/android-appium.yml
# Two jobs run in parallel on every push:
#   web-tests    -> Playwright tests marked @pytest.mark.web (browser, no emulator)
#   mobile-tests -> every test NOT marked web (mobile, hybrid and untagged tests),
#                   with both the Playwright browser and the Android emulator available
name: Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  # ---------------------------------------------------------------- WEB
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # "|| test $? -eq 5" = don't fail if no tests are marked "web" yet
      - name: Run web tests
        env:
          HEADLESS: "true"
        run: python -m pytest tests -m web -v --junitxml=report-web.xml || test $? -eq 5

      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: |
            report-web.xml
            allure-results/
          if-no-files-found: ignore

  # ------------------------------------------------------------- MOBILE
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installs everything (including playwright) because BaseTest.py imports it
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout   # stops a single hung test after --timeout seconds

      # Needed by hybrid tests that use the browser and the app together
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          sleep 10

      # Diagnostic: shows how fast the UAT servers answer from GitHub's machines.
      # Never fails the job. Add the mobile app's API address to the list if you know it.
      - name: Check UAT server reachability
        continue-on-error: true
        run: |
          echo "Runner IP: $(curl -s https://api.ipify.org)"
          for url in \
            https://webuat.myalphy.com/pages/Login.aspx \
            https://demo1uat.myalphy.com/pages/Login.aspx \
            https://demo2uat.myalphy.com/pages/Login.aspx \
            https://adminuat.myalphy.com/pages/Login.aspx ; do
            curl -s -o /dev/null --max-time 30 \
              -w "%{http_code}  %{time_total}s  $url\n" "$url" || echo "FAILED  $url"
          done

      - name: Run mobile tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PATH: ${{ github.workspace }}/app/app-uat-release.apk   # APK committed in the repo
          APPIUM_URL: http://127.0.0.1:4723                          # Appium server started above
          HEADLESS: "true"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4                 # runner has 4 CPUs; default 2 makes the emulator slow
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Each line runs as a separate command inside the booted emulator:
          #  1. hide Android's "<app> isn't responding" / crash popups - on a slow CI emulator
          #     the Pixel Launcher often freezes and its popup covers the app, failing every test
          #  2. wait 20s so the system finishes starting up before the tests begin
          #  3. run the tests (log_cli = live log lines; --timeout = fail a test stuck > 5 min)
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 20
            python -m pytest tests -m "not web" -v -o log_cli=true -o log_cli_level=INFO --timeout=300 --junitxml=report-mobile.xml || test $? -eq 5

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: |
            report-mobile.xml
            appium.log
            allure-results/
            failure-screens/
          if-no-files-found: ignore