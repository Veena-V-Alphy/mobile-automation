# Save this file in your repo as: .github/workflows/android-appium.yml
# Runs on every push to main, on pull requests, manually, and every day at 9:00 AM IST.
# Two jobs run in parallel:
#   web-tests    -> Playwright tests marked @pytest.mark.web (browser, no emulator)
#   mobile-tests -> every test NOT marked web (mobile, hybrid and untagged tests),
#                   with both the Playwright browser and the Android emulator available
name: Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  # Scheduled run. Cron times are in UTC: IST = UTC + 5:30, so 03:30 UTC = 9:00 AM IST.
  # Only runs from the default branch (main). Examples:
  #   "30 3 * * 1-5"  -> weekdays 9:00 AM IST
  #   "30 3,12 * * *" -> daily 9:00 AM and 6:00 PM IST
  schedule:
    - cron: "0 6 * * *"

jobs:
  # ---------------------------------------------------------------- WEB
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # Delete any old results that were committed to the repo, so the report shows ONLY this run
      - name: Remove old test results
        run: rm -rf allure-results allure-report failure-screens report-web.xml

      # "|| test $? -eq 5" = don't fail if no tests are marked "web" yet
      # --alluredir / --clean-alluredir = write fresh Allure results for this run
      - name: Run web tests
        env:
          HEADLESS: "true"
        run: python -m pytest tests -m web -v --alluredir=allure-results --clean-alluredir --junitxml=report-web.xml || test $? -eq 5

      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: |
            report-web.xml
            allure-results/
          if-no-files-found: ignore

  # ------------------------------------------------------------- MOBILE
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # Personal + DG suites; ~15 min each locally, slower on the CI emulator

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installs everything (including playwright) because BaseTest.py imports it
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout   # stops a single hung test after --timeout seconds

      # Needed by hybrid tests that use the browser and the app together
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # Allure command-line tool (needs Java, set up above) - turns allure-results/ into the HTML report
      - name: Install Allure
        run: npm install -g allure-commandline

      # Delete any old results that were committed to the repo (e.g. from a local Windows run),
      # otherwise the Allure report mixes them in and shows old "broken" tests
      - name: Remove old test results
        run: rm -rf allure-results allure-report failure-screens report-mobile.xml appium.log

      # --default-capabilities are added to every Appium session the tests create:
      #   uiautomator2ServerLaunchTimeout / adbExecTimeout -> more time on a slow CI emulator
      #   newCommandTimeout -> don't kill the session while a long web step is running
      #   settings[waitForIdleTimeout]=0 -> fixes "Timed out waiting for the root AccessibilityNodeInfo"
      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 \
            --default-capabilities '{"appium:uiautomator2ServerLaunchTimeout":60000,"appium:adbExecTimeout":60000,"appium:newCommandTimeout":300,"appium:settings[waitForIdleTimeout]":0}' \
            > appium.log 2>&1 &
          sleep 10

      # Diagnostic: shows how fast the UAT servers answer from GitHub's machines.
      # Never fails the job. Add the mobile app's API address to the list if you know it.
      - name: Check UAT server reachability
        continue-on-error: true
        run: |
          echo "Runner IP: $(curl -s https://api.ipify.org)"
          for url in \
            https://webuat.myalphy.com/pages/Login.aspx \
            https://demo1uat.myalphy.com/pages/Login.aspx \
            https://demo2uat.myalphy.com/pages/Login.aspx \
            https://adminuat.myalphy.com/pages/Login.aspx ; do
            curl -s -o /dev/null --max-time 30 \
              -w "%{http_code}  %{time_total}s  $url\n" "$url" || echo "FAILED  $url"
          done

      - name: Run mobile tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PATH: ${{ github.workspace }}/app/app-uat-release.apk   # APK committed in the repo
          APPIUM_URL: http://127.0.0.1:4723                          # Appium server started above
          HEADLESS: "true"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4                 # runner has 4 CPUs; default 2 makes the emulator slow
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Each line runs as a separate command inside the booted emulator:
          #  1. hide Android's "<app> isn't responding" / crash popups - on a slow CI emulator
          #     the Pixel Launcher often freezes and its popup covers the app, failing every test
          #  2. wait 20s so the system finishes starting up before the tests begin
          #  3. run the tests (log_cli = live log lines; --timeout = fail a test stuck > 5 min;
          #     --alluredir/--clean-alluredir = fresh Allure results for this run only)
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 20
            python -m pytest tests -m "not web" -v -o log_cli=true -o log_cli_level=INFO --timeout=300 --alluredir=allure-results --clean-alluredir --junitxml=report-mobile.xml || test $? -eq 5

      # --single-file = one index.html you can open by double-clicking (no web server needed)
      - name: Build Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean --single-file || echo "No Allure results to build a report from"

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: |
            report-mobile.xml
            appium.log
            allure-results/
            allure-report/
            failure-screens/
          if-no-files-found: ignore
      # Counts passed / failed tests from the JUnit XML so the email subject can show them
      - name: Summarise test results
        id: summary
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          t = f = e = s = 0
          if os.path.exists("report-mobile.xml"):
              root = ET.parse("report-mobile.xml").getroot()
              for ts in root.iter("testsuite"):
                  t += int(ts.get("tests", 0)); f += int(ts.get("failures", 0))
                  e += int(ts.get("errors", 0)); s += int(ts.get("skipped", 0))
          passed = t - f - e - s
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total={t}\npassed={passed}\nfailed={f + e}\nskipped={s}\n")
          PY

      # Emails the single-file Allure report (allure-report/index.html) to the people in
      # the REPORT_RECIPIENTS variable. Needs these repo secrets (Settings -> Secrets and
      # variables -> Actions): MAIL_SERVER, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD.
      - name: Email Allure report
        if: always()
        continue-on-error: true      # a mail problem should never fail the test job
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: ${{ secrets.MAIL_PORT == '465' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Automation Tests <${{ secrets.MAIL_USERNAME }}>
          to: ${{ vars.REPORT_RECIPIENTS }}
          subject: "Mobile tests ${{ job.status }}: ${{ steps.summary.outputs.passed }}/${{ steps.summary.outputs.total }} passed (${{ github.event_name }})"
          html_body: |
            <p>Mobile automation run finished with status <b>${{ job.status }}</b>.</p>
            <ul>
              <li>Total: ${{ steps.summary.outputs.total }}</li>
              <li>Passed: ${{ steps.summary.outputs.passed }}</li>
              <li>Failed: ${{ steps.summary.outputs.failed }}</li>
              <li>Skipped: ${{ steps.summary.outputs.skipped }}</li>
            </ul>
            <p>The Allure report is attached. Download it and open <code>index.html</code> in a browser.</p>
            <p>Full run, logs and screenshots:
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>
          attachments: allure-report/index.html
