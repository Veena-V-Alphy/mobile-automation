[pytest]
# Every run writes fresh Allure results, however it is started (PyCharm, the
# run_tests .bat, or plain "pytest"). Without this, a run started without
# --alluredir left the old results in place and the report never changed.
addopts = --alluredir=allure-results --clean-alluredir
markers =
    web: Playwright browser tests (run in the web-tests job)
    mobile: Appium tests on the Android emulator (run in the mobile-tests job)
    hybrid: tests that use both the browser and the mobile app (run in the mobile-tests job)